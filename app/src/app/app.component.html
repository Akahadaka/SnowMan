<main class="shell">
  <aside class="sidebar" data-theme="dark">
    <div class="sidebar-top">
      <div class="brand-block">
        <p class="eyebrow">SnowRunner Mod Manager</p>
        <h1 class="m-0 leading-tight">{{ shellTitle }}</h1>
      </div>

      @if (hasActiveProfile) {
        <div class="card card-compact bg-base-200" aria-label="Selected profile actions">
          <div class="card-body gap-2">
            <span class="text-xs font-bold uppercase tracking-widest text-primary">Active profile</span>
            <p class="text-sm opacity-75 m-0">{{ activeProfileSummary }}</p>
            @if (shellStatusMessage) {
              <p class="text-xs text-warning m-0">{{ shellStatusMessage }}</p>
            }
            <div class="card-actions pt-1 flex-wrap gap-2">
              <button type="button" class="btn btn-primary btn-sm flex-1" (click)="launchModded()">
                ▶ Start modded
              </button>
              <button type="button" class="btn btn-outline btn-sm flex-1" (click)="launchVanilla()">
                ▶ Start vanilla
              </button>
            </div>
          </div>
        </div>
      }
    </div>

    <ul class="menu menu-sm mt-auto gap-0.5" aria-label="Primary">
      @for (item of navigationItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >{{ item.label }}</a>
        </li>
      }
    </ul>
  </aside>

  <section class="content">
    <router-outlet />
  </section>
</main>
