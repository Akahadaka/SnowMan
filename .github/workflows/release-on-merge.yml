name: Build and Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build artifacts (${{ matrix.os }})
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install app dependencies
        run: npm ci

      - name: Build desktop bundles
        run: npm run tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: app/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') }}
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundles-*
          merge-multiple: false

      - name: Derive release version
        run: |
          VERSION="${GITHUB_HEAD_REF#release/}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release branch semantic version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub release and attach bundles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SnowMan v${{ env.VERSION }}
          target_commitish: main
          generate_release_notes: true
          files: artifacts/**/*

  bump-develop-version:
    name: Bump minor version on develop
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') }}
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Compute next minor version
        run: |
          VERSION="${GITHUB_HEAD_REF#release/}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
          echo "RELEASED_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"

      - name: Update version in app files
        run: |
          sed -i "s/\"version\": \"${RELEASED_VERSION}\"/\"version\": \"${NEXT_VERSION}\"/" app/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \"${RELEASED_VERSION}\"/\"version\": \"${NEXT_VERSION}\"/" app/package.json
          sed -i "s/^version = \"${RELEASED_VERSION}\"/version = \"${NEXT_VERSION}\"/" app/src-tauri/Cargo.toml

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src-tauri/tauri.conf.json app/package.json app/src-tauri/Cargo.toml
          git commit -m "chore: bump version to ${NEXT_VERSION} after release v${RELEASED_VERSION}"
          git push origin develop
