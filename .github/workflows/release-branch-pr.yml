name: Prepare Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-branch-and-pr:
    name: Create release branch and PR to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Validate semantic version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must match semantic format x.y.z"
            exit 1
          fi

      - name: Create release branch from develop
        env:
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin"
          else
            git checkout -B "$BRANCH" "origin/develop"
            git push origin "$BRANCH"
          fi

      - name: Open PR from release branch to main
        id: open-pr
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            const head = `release/${version}`;
            const base = 'main';

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base,
              per_page: 1
            });

            if (prs.length > 0) {
              core.setOutput('url', prs[0].html_url);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              base,
              title: `release: v${version}`,
              body: [
                `Automated release PR for v${version}.`,
                '',
                '- Source branch: `develop`',
                `- Release branch: \`${head}\``,
                '- Target branch: `main`',
                '',
                'After merge, the release workflow will build installers for Windows, macOS, and Linux and publish a GitHub Release with generated notes and attached artifacts.'
              ].join('\n')
            });

            core.setOutput('url', pr.html_url);

      - name: Print PR URL
        run: echo "Release PR ${{ steps.open-pr.outputs.url }}"
